services:
  repotranscoder:
    image: repotranscoder

    build:
      context: .
      dockerfile: apps/transcoder/Dockerfile

    env_file:
      - .env.development.local

    environment:
      NODE_ENV: production
      FFMPEG_PATH: ffmpeg
      TRANSCODER_PORT: 8080

    ports:
      - "8080:8080"
